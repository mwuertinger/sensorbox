version: 2
updates:
  # Dependabot runs go mod tidy without running protoc.sh, so the generated protobuf code is
  # missing. server/pb/doc.go and config-tool/pb/doc.go keep the pb packages resolvable; see there.
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: monthly
    groups:
      server:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /config-tool
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
